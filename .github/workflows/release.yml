# Release: runs on a v* tag. The jobs run in this order, each gated on the
# one before it:
#   check-tag -> tests -> build -> install-test (3 images) -> release
# Only the final job can write to the repository.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must be v + gozer.__version__
        run: python scripts/check_tag.py "$GITHUB_REF_NAME"

  tests:
    needs: [check-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest pytest-timeout pyyaml
      - name: Run the suite
        run: python -m pytest -q

  build:
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: debian:12
    steps:
      - uses: actions/checkout@v4
      # Keep this job's run: text identical in ci.yml and release.yml (a test
      # enforces it); edit both files together.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts equivs fakeroot lintian ca-certificates
      - name: Install build dependencies from debian/control
        run: |
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control
      - name: Build the package in a copy outside the checkout
        run: |
          mkdir -p /tmp/build
          cp -a "$GITHUB_WORKSPACE" /tmp/build/tt-gozer
          cd /tmp/build/tt-gozer
          dpkg-buildpackage -us -uc -b
          cd /tmp/build
          ls -l
          cp tt-gozer_*_all.deb tt-gozer_*.changes "$GITHUB_WORKSPACE"/
      - name: lintian
        run: |
          cd /tmp/build
          status=0
          lintian --info --display-info --pedantic --fail-on error tt-gozer_*.changes \
            > /tmp/lintian.txt 2>&1 || status=$?
          cat /tmp/lintian.txt
          {
            echo "### lintian"
            echo '```'
            cat /tmp/lintian.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: tt-gozer-deb
          path: tt-gozer_*_all.deb
          if-no-files-found: error

  install-test:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tt-gozer-deb
      - name: Install and exercise the package on ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD":/work -w /work "$IMAGE" bash -c '
            set -ex
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ./tt-gozer_*_all.deb
            gozer --version
            gozer-install-skills --to /tmp/skills
            ls -l /tmp/skills
            sh debian/tests/smoke
          '

  release:
    needs: [install-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tt-gozer-deb
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./tt-gozer_*_all.deb
