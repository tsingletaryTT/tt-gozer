[pytest]
testpaths = tests
pythonpath = . tests

# Declared so the marker is a documented part of this suite rather than an
# unknown one pytest merely tolerates. The behaviour behind it comes from
# pytest-timeout, the suite's one dev dependency:
#
#     pip install pytest-timeout
#
# Without that plugin installed the marker is inert -- the two tests that
# carry it (tests/test_keymaster.py, signal forwarding) then hang for the
# full 10 seconds their child sleeps instead of failing fast at 5. They still
# pass or fail correctly; they just stop being the fast tripwire they were
# written to be, which is easy to miss when nothing warns you.
markers =
    timeout(seconds): fail a test that runs longer than `seconds` (pytest-timeout)
