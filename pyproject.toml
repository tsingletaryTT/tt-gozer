#
# Minimal setuptools build definition. Debian's pybuild reads this to package
# gozer. Only the `gozer` package ships; site_build/ and scripts/ never do.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-gozer"
description = "Cooperative Tenstorrent chip leasing so multiple agents can share one box"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# The version lives in gozer/__init__.py; see [tool.setuptools.dynamic].
dynamic = ["version"]

[project.scripts]
gozer = "gozer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gozer.__version__" }

[tool.setuptools.packages.find]
include = ["gozer*"]

[tool.setuptools.package-data]
gozer = ["report_template.html", "history_archive.jsonl"]
